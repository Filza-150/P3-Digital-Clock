<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <div class="content">
        <div class="clock">
          <div class="clock-line first"></div>
          <div class="clock-line second"></div>
          <div class="clock-line third"></div>
          <div class="clock-line forth"></div>
          <div class="clock-line fifth"></div>
          <div class="clock-line sixth"></div>
          <div class="center"></div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
